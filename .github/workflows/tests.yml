name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: jq
        run: command -v jq || (sudo apt-get update && sudo apt-get install -y jq)
      - name: versions
        run: |
          uname -a
          jq --version
          bash --version | head -1
      - name: tests
        run: tests/run.sh
